name: Release

# Push a tag like v0.6.1 to build both jars (Aino and A200, each with its .jad)
# and publish them as a GitHub release. The version in the .jad comes from the tag.

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Build jars
        run: VER="${GITHUB_REF_NAME#v}" sh build.sh

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/LegacyLyrion-Aino.jar
            dist/LegacyLyrion-Aino.jad
            dist/LegacyLyrion-A200.jar
            dist/LegacyLyrion-A200.jad
          generate_release_notes: true
